name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: python 3.10 (cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # before the package, so it resolves torch as satisfied and never pulls the CUDA build
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # the service extra is a test dependency now that tests/test_service.py drives the endpoints,
      # and httpx is what fastapi's TestClient calls them through. requests is the excel_integration
      # client's own transport - the add-in is not part of the installed library, so it is declared
      # here rather than in setup.py
      - name: Install derivus
        run: pip install -e '.[service]' pytest httpx requests

      - name: Confirm we are testing the repo, on CPU
        run: python -c "import derivus, torch; print(derivus.__version__, derivus.__file__, torch.__version__, torch.cuda.is_available())"

      # -rs so the skips read in the log. Expect 8: 2 calibration tests wanting licensed market
      # data, 6 AAD-vs-CRN gates whose oracle is calibrated on CUDA reduction order.
      - name: Run the suite
        run: pytest tests -q -rs
