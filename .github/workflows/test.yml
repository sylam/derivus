name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: python 3.10 (cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # before the package, so it resolves torch as satisfied and never pulls the CUDA build
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # the desk extra carries what the tests drive: the service endpoints (tests/test_service.py)
      # and the MCP binding's requests + mcp (tests/test_mcp.py) - requests also being the
      # excel_integration client's transport. httpx is what fastapi's TestClient calls through.
      - name: Install derivus
        run: pip install -e '.[desk]' pytest httpx

      - name: Confirm we are testing the repo, on CPU
        run: python -c "import derivus, torch; print(derivus.__version__, derivus.__file__, torch.__version__, torch.cuda.is_available())"

      # -rs so the skips read in the log. Expect 8: 2 calibration tests wanting licensed market
      # data, 6 AAD-vs-CRN gates whose oracle is calibrated on CUDA reduction order.
      - name: Run the suite
        run: pytest tests -q -rs
