name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push to the same branch supersedes an in-flight run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: python 3.10 (cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 3.10 to match the development environment. No version matrix: derivus is a pure-python
      # wheel (py3-none-any, no ext_modules, no version-gated syntax), so a second interpreter
      # runs the same suite for the same answer. What this job buys that a local run does not is
      # a clean-room install on a machine that is not the author's, exercising the CPU path.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # CPU wheels first, so installing the package finds torch already satisfied and never
      # pulls the multi-GB CUDA build the runners have no card for
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install derivus
        run: pip install -e . pytest

      - name: Confirm we are testing the repo, on CPU
        run: |
          python -c "import derivus, torch; print('derivus', derivus.__version__, derivus.__file__); print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      # -rs prints why anything skipped, so the coverage gap is visible in the log rather than
      # hidden in a count. Expect 8: two calibration tests wanting data/pl_exp.csv, which is
      # licensed market data we cannot redistribute, and six AAD-vs-CRN gates whose oracle is
      # calibrated on CUDA reduction order and reads noise on a CPU runner.
      - name: Run the suite
        run: pytest tests -q -rs
