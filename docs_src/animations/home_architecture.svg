<svg class="dv-arch" viewBox="0 0 960 536" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Seats price on their own engine and GPU and send bookings and approvals to one hub. Its service has the hub engine judge each write and appends it to one log. The views, the back office's diary and the replicas are read from that log.">
<style>
  /* Colours follow the Material scheme; the fallbacks serve the file opened on its own. */
  .dv-arch { --fg: var(--md-default-fg-color, #182230); --mut: var(--md-default-fg-color--light, #5d6b7a);
    --panel: var(--md-default-bg-color, #fff); --rail: #8794a3;
    --seat: #2f5bea; --hub: #0f4c5c; --log: #a8681a; --write: #ff9f1c; --read: #0b8a7a;
    display: block; width: 100%; min-width: 720px; height: auto; margin: 1.2em 0; }
  [data-md-color-scheme="slate"] .dv-arch { --seat: #7f9cff; --hub: #7cc4d1; --log: #e2a84a; --write: #ffb547; --read: #3fc2af; }
  .dv-arch text { fill: var(--fg); font-size: 12.5px; text-anchor: middle; }
  .dv-arch .h { font-size: 13.5px; font-weight: 700; }
  .dv-arch .m, .dv-arch .el { fill: var(--mut); }
  .dv-arch .el { font-size: 11.5px; }
  .dv-arch .s { text-anchor: start; }
  .dv-arch .e { text-anchor: end; }
  .dv-arch .seat { --k: var(--seat); }
  .dv-arch .hub { --k: var(--hub); }
  .dv-arch .log { --k: var(--log); }
  .dv-arch .ext { --k: var(--rail); }
  .dv-arch .z { fill: var(--k); fill-opacity: .08; stroke: var(--k); stroke-opacity: .5; }
  .dv-arch .zl { fill: var(--k); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-anchor: start; }
  .dv-arch .c { fill: var(--panel); stroke: var(--k); stroke-width: 1.5; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .18)); }
  .dv-arch .c.log { stroke-width: 2.5; }
  .dv-arch .copy { stroke-dasharray: 5 4; }
  .dv-arch .chip { fill: var(--seat); }
  .dv-arch .ct { fill: var(--panel); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; }
  .dv-arch .busy { fill: var(--panel); animation: dv-busy 1.6s ease-in-out infinite; }
  .dv-arch .blk { fill: var(--log); fill-opacity: .4; }
  .dv-arch .link { stroke: var(--log); stroke-opacity: .5; stroke-width: 2; }
  .dv-arch .new { fill-opacity: 1; transform-box: fill-box; transform-origin: center; animation: dv-append 2.4s ease-in-out infinite; }
  .dv-arch marker path { fill: var(--rail); }
  .dv-arch .rail { fill: none; stroke: var(--rail); stroke-width: 1.5; marker-end: url(#dv-tip); }
  .dv-arch .flow use { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: .01 18; animation: dv-flow .9s linear infinite; }
  .dv-arch .write { stroke: var(--write); fill: var(--write); }
  .dv-arch .read { stroke: var(--read); fill: var(--read); }
  @keyframes dv-flow { to { stroke-dashoffset: -18; } }
  @keyframes dv-busy { 50% { opacity: .25; } }
  @keyframes dv-append { 0%, 10% { opacity: 0; transform: scale(.3); } 35%, 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .dv-arch .flow use, .dv-arch .new, .dv-arch .busy { animation: none; } }
</style>
<defs>
  <marker id="dv-tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 8,4 0,8z"/></marker>
  <path id="dv-mkt" d="M210,56 C300,56 410,96 410,207"/>
  <path id="dv-book" d="M224,238 H375"/>
  <path id="dv-view" d="M380,264 H225"/>
  <path id="dv-judge" d="M500,213 V133"/>
  <path id="dv-app" d="M475,289 V367"/>
  <path id="dv-conf" d="M780,236 H575"/>
  <path id="dv-diary" d="M634,405 C760,405 850,392 850,295"/>
  <path id="dv-bell" d="M634,470 H775"/>
</defs>
<rect class="z seat" x="10" y="110" width="210" height="262" rx="14"/>
<rect class="z hub" x="350" y="10" width="300" height="516" rx="14"/>
<text class="zl seat" x="24" y="132">Seats: compute is local</text>
<text class="zl hub" x="364" y="34">Hub: the single writer</text>
<g class="rail">
  <use href="#dv-mkt"/><use href="#dv-book"/><use href="#dv-view"/><use href="#dv-judge"/><use href="#dv-app"/>
  <use href="#dv-conf"/><use href="#dv-diary"/><use href="#dv-bell" class="copy"/>
</g>
<g class="flow write"><use href="#dv-mkt"/><use href="#dv-book"/><use href="#dv-judge"/><use href="#dv-app"/><use href="#dv-conf"/></g>
<g class="flow read"><use href="#dv-view"/><use href="#dv-diary"/><use href="#dv-bell"/></g>
<text class="el s" x="228" y="46">quotes, fixings</text>
<text class="el" x="292" y="229">bookings, approvals</text>
<text class="el" x="292" y="282">views</text>
<text class="el s" x="510" y="178">validate before write</text>
<text class="el s" x="485" y="332">append</text>
<text class="el" x="715" y="227">confirmed, settled</text>
<text class="el e" x="826" y="345">diary, settlement file, calls</text>
<text class="el" x="707" y="461">doorbell, then pull</text>
<rect class="c ext" x="20" y="26" width="190" height="60" rx="8"/>
<text class="h" x="115" y="51">Bloomberg</text>
<text class="m" x="115" y="70">quotes and fixings</text>
<rect class="c seat" x="24" y="144" width="182" height="100" rx="8"/>
<text class="h" x="115" y="169">Trading and structuring</text>
<text class="m" x="115" y="188">Web UI &#183; Excel &#183; DV_MCP</text>
<rect class="chip" x="41" y="204" width="148" height="24" rx="12"/>
<circle class="busy" cx="56" cy="216" r="3.5"/>
<text class="ct" x="122" y="220">own engine and GPU</text>
<rect class="c seat" x="24" y="258" width="182" height="100" rx="8"/>
<text class="h" x="115" y="283">Risk and control</text>
<text class="m" x="115" y="302">Web UI &#183; Python</text>
<rect class="chip" x="41" y="318" width="148" height="24" rx="12"/>
<circle class="busy" cx="56" cy="330" r="3.5" style="animation-delay: -.8s"/>
<text class="ct" x="122" y="334">own engine and GPU</text>
<rect class="c hub" x="440" y="52" width="196" height="76" rx="8"/>
<text class="h" x="538" y="78">Hub engine</text>
<text class="m" x="538" y="97">judges each write,</text>
<text class="m" x="538" y="113">official marks and xVA</text>
<rect class="c hub" x="380" y="213" width="190" height="76" rx="8"/>
<text class="h" x="475" y="247">DV_Service</text>
<text class="m" x="475" y="266">verbs and grants</text>
<rect class="c log" x="366" y="372" width="268" height="140" rx="8"/>
<text class="h" x="500" y="396">Spine home</text>
<text class="m" x="500" y="414">one log, never edited</text>
<path class="link" d="M409,439h8m26,0h8m26,0h8m26,0h8m26,0h8m26,0h8"/>
<rect class="blk" x="383" y="426" width="26" height="26" rx="5"/>
<rect class="blk" x="417" y="426" width="26" height="26" rx="5"/>
<rect class="blk" x="451" y="426" width="26" height="26" rx="5"/>
<rect class="blk" x="485" y="426" width="26" height="26" rx="5"/>
<rect class="blk" x="519" y="426" width="26" height="26" rx="5"/>
<rect class="blk" x="553" y="426" width="26" height="26" rx="5"/>
<rect class="blk new" x="587" y="426" width="26" height="26" rx="5"/>
<text class="m" x="500" y="476">every view is a fold of it:</text>
<text class="m" x="500" y="494">positions, P&amp;L, cash, calls, diary</text>
<rect class="c ext" x="780" y="213" width="170" height="76" rx="8"/>
<text class="h" x="865" y="238">Back office</text>
<text class="m" x="865" y="257">confirmations</text>
<text class="m" x="865" y="273">and settlements</text>
<rect class="c ext copy" x="780" y="432" width="170" height="76" rx="8"/>
<text class="h" x="865" y="457">Replicas</text>
<text class="m" x="865" y="476">sealed copy,</text>
<text class="m" x="865" y="492">verified with no key</text>
<circle class="write" cx="30" cy="398" r="4.5"/>
<text class="el s" x="42" y="402">written to the log</text>
<circle class="read" cx="30" cy="420" r="4.5"/>
<text class="el s" x="42" y="424">read from the log</text>
</svg>
